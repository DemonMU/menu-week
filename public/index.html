<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 小泡泡的每周食谱冒险</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="game-bg"></div>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>🎮 小泡泡的每周食谱冒险</h1>
        <div class="current-date" id="currentDate">
          <!-- 动态显示当前日期 -->
        </div>
      </div>
      <button id="addDishBtn" class="btn btn-primary game-btn">
        <span class="btn-icon">⚔️</span>
        <span>添加新菜品</span>
      </button>
    </header>

    <main>
      <div class="week-menu" id="weekMenu">
        <!-- 动态生成周一到周日的菜品 -->
      </div>
    </main>
  </div>

  <!-- 添加/编辑菜品模态框 -->
  <div id="dishModal" class="modal">
    <div class="modal-content game-modal">
      <div class="modal-header">
        <h2 id="modalTitle">🍖 添加菜品</h2>
        <span class="close game-close">✕</span>
      </div>
      <div class="modal-body">
        <form id="dishForm" enctype="multipart/form-data">
          <input type="hidden" id="dishId" name="dishId">
          
          <div class="form-group">
            <label for="dishName">🏷️ 菜品名称 *</label>
            <input type="text" id="dishName" name="name" required placeholder="输入你的美食名称">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="dayOfWeek">📅 星期 *</label>
              <select id="dayOfWeek" name="day_of_week" required>
                <option value="1">星期一</option>
                <option value="2">星期二</option>
                <option value="3">星期三</option>
                <option value="4">星期四</option>
                <option value="5">星期五</option>
                <option value="6">星期六</option>
                <option value="7">星期日</option>
              </select>
            </div>

            <div class="form-group">
              <label for="mealType">🍽️ 餐次 *</label>
              <select id="mealType" name="meal_type" required>
                <option value="breakfast">早餐</option>
                <option value="lunch">午餐</option>
                <option value="dinner">晚餐</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="description">📝 菜品描述</label>
            <textarea id="description" name="description" rows="2" placeholder="描述一下这道美食（可选）"></textarea>
          </div>

          <div class="form-group">
            <label for="videoFile">🎬 烹饪视频（可选）</label>
            <input type="file" id="videoFile" name="video" accept="video/*">
            <small class="help-text">支持 MP4, MOV, WEBM 格式，最大 100MB</small>
            <div id="currentVideo" class="current-video"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary game-btn" id="cancelBtn">
              <span>❌ 取消</span>
            </button>
            <button type="submit" class="btn btn-primary game-btn">
              <span>✅ 保存</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 视频播放模态框 -->
  <div id="videoModal" class="modal">
    <div class="modal-content video-modal-content game-modal">
      <div class="modal-header">
        <h2 id="videoTitle">🎬 烹饪视频</h2>
        <span class="close game-close" id="videoClose">✕</span>
      </div>
      <div class="video-container">
        <video id="videoPlayer" controls>
          <source src="" type="video/mp4">
          您的浏览器不支持视频播放。
        </video>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
